<script>
"use strict";
/* ============================================================
   SIMULATION -- copied VERBATIM from index.html (BUILD 20260925-hcap-auto).
   The 3D layer below only draws this state. Every block headed
   "index.html:" is the live game's own code, so courses, collisions, speed
   ramp, coins, combo, grazes and boosts behave exactly as they do in 2D
   (verified 2026-09-27: identical scores, 2D vs 3D, 4 games x 7 twists).
   ============================================================ */
const qs = new URLSearchParams(location.search);
// ---- index.html: daily seed helpers ----
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
};
const dateLabel = () => new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const seedFromDate = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
// ---- index.html: V2 rules, twists ----
const V2 = () => true;
const RUN_SECS = () => V2() ? 60 : 90;
// Difficulty progress mapper: every course formula runs on diffP(x) where x
// is raw progress 0..1 through the run. V2 compresses the whole old curve
// into the first 0 seconds and keeps climbing (0.667 -> 1.117 of the old
// scale).
const diffP = x => V2() ? 0.667 + 0.45 * Math.min(x, 1) : Math.min(x, 1);

// Daily modifier: the date picks one twist for EVERYONE (separate seed stream
// from the maze layout, so adding mods never reshuffles the course).
const MODS = [
  { id: "classic", name: "CLASSIC",       desc: "no twist. pure gauntlet" },
  { id: "rush",    name: "COIN RUSH",     desc: "coins everywhere, worth double" },
  { id: "fog",     name: "FOG",           desc: "you only see whats near you" },
  { id: "mirror",  name: "MIRROR",        desc: "left is right, right is left" },
  { id: "turbo",   name: "TURBO",         desc: "faster maze, 25% score bonus" },
  { id: "drift",   name: "MOVING WALLS",  desc: "every wall slides around" },
  { id: "squeeze", name: "TIGHT SQUEEZE", desc: "narrow gaps, +250 finish bonus" },
];
const modIndexRaw = ds => Math.floor(mulberry32(seedFromDate(ds + "mod"))() * MODS.length);
function todayMod() { return modForDate(new Date()); }
// Twist for any calendar date (the champion reel replays past days).
function modForDate(at) {
  // Never the same twist two days running. Each day's pick dodges the
  // PREVIOUS day's effective pick, so replay the last 30 days from a fixed
  // offset -- cheap, and every device walks the same dates to the same answer.
  const d = new Date(at.getFullYear(), at.getMonth(), at.getDate()); d.setDate(d.getDate() - 30);
  let prev = -1;
  for (let k = 0; k <= 30; k++) {
    const ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    let i = modIndexRaw(ds);
    if (i === prev)
      i = (i + 1 + Math.floor(mulberry32(seedFromDate(ds + "mod2"))() * (MODS.length - 1))) % MODS.length;
    prev = i;
    d.setDate(d.getDate() + 1);
  }
  return MODS[prev];
}
// ---- index.html: chiptune music (per-game tunes) ----
const Music = (() => {
  const m = n => 440 * Math.pow(2, (n - 69) / 12);        // MIDI note -> Hz
  // chord tones from a root: [root, third, fifth, octave]. Lead plays these +24
  // (bright arcade register); bass bounces root <-> root+12.
  const IVAL = { min: [0,3,7,12], maj: [0,4,7,12], dim: [0,3,6,12], sus: [0,5,7,12] };
  // 8-step arp patterns index the 4 chord tones (0..3). 0 = rest.
  const PAT = {
    updown: [0,1,2,3,2,1,0,1], climb: [0,1,2,3,0,1,2,3], down: [3,2,1,0,3,2,1,0],
    pedal:  [0,2,0,3,0,2,0,1], skip:  [0,2,1,3,2,0,1,2], bounce: [0,3,1,3,0,3,1,3],
    gallop: [0,0,2,3,2,2,1,0], sparse:[0,0,0,3,0,0,2,0],
  };
  // Build LEAD/BASS 32-step arrays (Hz) from a 4-chord progression + pattern.
  function build(prog, patName) {
    const pat = PAT[patName], lead = [], bass = [];
    for (const [root, type] of prog) {
      const tones = IVAL[type].map(iv => root + iv);
      for (let i = 0; i < 8; i++) {
        const p = pat[i];
        lead.push(p === 0 && pat === PAT.sparse && i !== 0 ? 0 : m(tones[p] + 24));
        bass.push(m(i === 2 || i === 6 ? root + 12 : root));
      }
    }
    return { lead, bass };
  }
  // One track per game id. bpm, waveforms, arp pattern, and a 4-chord loop.
  const SPEC = {
    gauntlet:{bpm:138,lw:"square",  bw:"triangle",pat:"updown",prog:[[45,"min"],[41,"maj"],[48,"maj"],[43,"maj"]]},
    laser:   {bpm:152,lw:"sawtooth",bw:"triangle",pat:"down",  prog:[[52,"min"],[50,"maj"],[47,"maj"],[45,"maj"]]},
    hunter:  {bpm:160,lw:"square",  bw:"sawtooth",pat:"gallop",prog:[[50,"min"],[45,"maj"],[48,"maj"],[50,"min"]]},
    crushers:{bpm:104,lw:"square",  bw:"triangle",pat:"pedal", prog:[[48,"min"],[44,"maj"],[43,"maj"],[48,"min"]]},
    tunnel:  {bpm:146,lw:"triangle",bw:"triangle",pat:"climb", prog:[[48,"maj"],[45,"min"],[43,"maj"],[41,"maj"]]},
    slalom:  {bpm:150,lw:"square",  bw:"square",  pat:"bounce",prog:[[43,"maj"],[48,"maj"],[45,"min"],[50,"maj"]]},
    phantom: {bpm:120,lw:"triangle",bw:"triangle",pat:"sparse",prog:[[46,"dim"],[45,"min"],[44,"maj"],[46,"dim"]]},
    pong:    {bpm:132,lw:"square",  bw:"square",  pat:"updown",prog:[[48,"maj"],[43,"maj"],[48,"maj"],[45,"min"]]},
    meteor:  {bpm:144,lw:"sawtooth",bw:"triangle",pat:"skip",  prog:[[45,"min"],[52,"min"],[48,"maj"],[43,"maj"]]},
    windmill:{bpm:156,lw:"triangle",bw:"square",  pat:"climb", prog:[[50,"maj"],[45,"maj"],[43,"maj"],[50,"maj"]]},
    wind:    {bpm:128,lw:"triangle",bw:"triangle",pat:"pedal", prog:[[41,"maj"],[48,"maj"],[45,"min"],[43,"maj"]]},
    mines:   {bpm:140,lw:"square",  bw:"triangle",pat:"sparse",prog:[[47,"min"],[43,"maj"],[42,"maj"],[47,"min"]]},
    pistons: {bpm:150,lw:"square",  bw:"square",  pat:"pedal", prog:[[40,"min"],[47,"min"],[45,"maj"],[40,"min"]]},
    turrets: {bpm:134,lw:"square",  bw:"triangle",pat:"down",  prog:[[45,"min"],[45,"min"],[43,"maj"],[41,"maj"]]},
    // weekly champion reel: bright major victory loop (C-G-Am-F), not a game
    champ:   {bpm:132,lw:"square",  bw:"triangle",pat:"climb", prog:[[48,"maj"],[43,"maj"],[45,"min"],[41,"maj"]]},
  };
  // saw is harsher/louder -> tame its peak; triangle is quiet -> lift it.
  const LEAD_PEAK = { square: 0.11, sawtooth: 0.075, triangle: 0.13 };
  const BASS_PEAK = { square: 0.16, sawtooth: 0.13, triangle: 0.20 };
  const cache = {};
  const trackFor = id => {
    const sp = SPEC[id] || SPEC.gauntlet;
    if (!cache[id]) { const b = build(sp.prog, sp.pat); cache[id] = { ...sp, lead: b.lead, bass: b.bass, stepDur: 60 / sp.bpm / 2 }; }
    return cache[id];
  };
  let ctx = null, master = null, tmr = null, step = 0, nextT = 0, cur = null;
  let muted = false;
  let lvl = 1, startDelay = 0;   // per-track level + a one-time lead-in (the reel lets the fanfare ring first)

  function tone(freq, t, dur, type, peak) {
    if (!freq) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function hat(t) {
    const b = ctx.createBuffer(1, 800, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; hp.type = "highpass"; hp.frequency.value = 7000;
    g.gain.setValueAtTime(0.06 * lvl, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(hp); hp.connect(g); g.connect(master); s.start(t);
  }
  function schedule() {
    const T = cur;
    while (nextT < ctx.currentTime + 0.12) {
      const s = step % T.lead.length;
      tone(T.lead[s], nextT, T.stepDur * 0.9,  T.lw, LEAD_PEAK[T.lw] * lvl);
      tone(T.bass[s], nextT, T.stepDur * 0.95, T.bw, BASS_PEAK[T.bw] * lvl);
      if (s % 2 === 1) hat(nextT);                         // off-beat groove
      nextT += T.stepDur; step++;
    }
  }
  // iOS Safari drops the user-activation the moment the tap handler awaits, so
  // a resume() called AFTER `await ensurePin` no-ops -> the context stays
  // suspended and the clock is frozen (why music played on run 1, where the
  // context is created fresh, but went silent on every RUN AGAIN). unlock()
  // must be called SYNCHRONOUSLY in the click handler, before any await.
  function arm() {                                         // (re)start the step scheduler
    if (tmr || muted || !cur) return;
    step = 0; nextT = ctx.currentTime + 0.05 + startDelay; startDelay = 0;
    schedule(); tmr = setInterval(schedule, 40);
  }
  function ensureCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
      // iOS parks the context in "interrupted"/"suspended" once audio stops or
      // the app backgrounds; resume() fired mid-run then no-ops. Catch the
      // transition BACK to "running" and re-arm so music returns on the next
      // run instead of dying after run 1 (the bug Felix hit -- only run 1 had
      // sound). Also below: resume from ANY non-running state, not just
      // "suspended" (iOS uses "interrupted").
      ctx.onstatechange = () => { if (ctx.state === "running" && (G.running || (typeof REEL !== "undefined" && REEL.on))) arm(); };
    }
    if (ctx.state !== "running") ctx.resume();
  }
  // ---- one-shot sound effects (weekly champion reel) ----
  function noise(t, dur, peak, type, f0, f1) {
    const n = Math.ceil(ctx.sampleRate * dur), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = b; f.type = type; f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.02);
  }
  function sweep(t, f0, f1, dur, type, peak) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  // ---- 8-bit champion fanfare (Felix picked 2026-09-24: shared run + hit opening,
  // tune 3 SWING HERO or 4 LEVEL UP alternating by week, bar-3 arps + "ta-da" ending) ----
  let fanBus = null, pwaves = {};
  function bus() {                                          // fanfare-only limiter so the big hits never clip
    if (fanBus) return fanBus;
    const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -6; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.12;
    fanBus = ctx.createGain(); fanBus.gain.value = 0.5; fanBus.connect(lim); lim.connect(ctx.destination);
    return fanBus;
  }
  function pwave(duty) {
    if (pwaves[duty]) return pwaves[duty];
    const N = 48, re = new Float32Array(N), im = new Float32Array(N);
    for (let n = 1; n < N; n++) re[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * duty);
    return (pwaves[duty] = ctx.createPeriodicWave(re, im));
  }
  function chip(t, midi, dur, peak = 0.12, duty = 0.5, stac = 0.8) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.setPeriodicWave(pwave(duty)); o.frequency.value = m(midi);
    const len = Math.max(0.03, dur * stac);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + 0.004);
    g.gain.linearRampToValueAtTime(peak * 0.7, t + Math.min(0.06, len * 0.6)); g.gain.setValueAtTime(peak * 0.7, t + len - 0.01);
    g.gain.linearRampToValueAtTime(0.0001, t + len); o.connect(g); g.connect(bus()); o.start(t); o.stop(t + len + 0.02);
  }
  function nbass(t, midi, dur, peak = 0.3) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "triangle"; o.frequency.value = m(midi);
    const len = dur * 0.85; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + 0.004);

  wind: {
    name: "CROSSWINDS",
    howto: "the wind shoves you -- lean into it",
    modName: { drift: "GALE FORCE" },
    modDesc: { drift: "wind pushes 50% harder" },
    reset() {
      const total = avgCourseSpeed() * RUN_SECS() * 1.15;
      let y = -120;

function takeHit(py) {

  G.floaters = []; G.beams = []; G.things = []; G.bullets = [];
  G.combo = 0; G.bestCombo = 0; G.coinPts = 0;
  G.grazePts = 0; G.grazes = 0; G.grazeTimer = 0;

// Speed = 160 + 260 * diffP(progress). Jul-14 tuning ramps 160->420 over

function avgCourseSpeed(){ return 160 + 260 * (diffP(0) + diffP(1)) / 2; }
function worldSpeed() {
  const ramp = 160 + 260 * diffP(Math.min(G.t / RUN_SECS(), 1));
  return ramp * G.speedScale * G.slow * (G.mod === "turbo" ? 1.15 : 1);
}

function endRun(died) {

  const finishBonus = died ? 0 : 250 + (G.hearts * 50) + (G.mod === "squeeze" ? 250 : 0);
  let raw = G.coinPts + G.grazePts + Math.floor(survived) * 2 + finishBonus;
  if (G.mod === "turbo") raw *= 1.25;

    `<br>${Math.floor(survived)}s survived &times; 2` +

const SIDEWAYS = matchMedia("(orientation: landscape) and (max-height: 540px) and (pointer: coarse)");
function loop(ts) {
  if (!G.running) return;
  // phone turned sideways: hold the run still until it's upright again
  if (SIDEWAYS.matches) { G.lastTs = ts; requestAnimationFrame(loop); return; }
  const dt = Math.min((ts - G.lastTs) / 1000, 0.05);
  const frameMs = ts - G.lastTs;
  G.lastTs = ts; G.t += dt;
  if (G.t >= RUN_SECS()) { G.finished = true; endRun(false); return; }

  // ---- index.html loop(): steering, scroll, hazards, coin pull + combo ----
  // steer: lerp toward target; held arrow keys glide instead of stepping
  const mdir = G.mod === "mirror" ? -1 : 1;
  if (keys.ArrowLeft || keys.a) G.targetX -= 300 * dt * mdir;
  if (keys.ArrowRight || keys.d) G.targetX += 300 * dt * mdir;
  G.targetX = Math.max(14, Math.min(W - 14, G.targetX));
  G.px += (G.targetX - G.px) * Math.min(1, dt * 12);
  G.px = Math.max(14, Math.min(W - 14, G.px));

  const vs = worldSpeed() * dt;
  const py = H * 0.78;
  for (const c of G.coinDots) c.y += vs;

  // hazards: the week's game moves its own obstacles and calls takeHit()
  if (G.inv > 0) G.inv -= dt;
  G.game.update(dt, py, vs);
  if (!G.running) return;   // takeHit drained the last heart mid-update
  // coins: everyone gets a small pull so near-misses still collect (the
  // finger covers the orb on a phone -- exact alignment shouldn't be the
  // skill); the MAGNET boost is the same idea with real range.
  // MAGNET pull must always beat the world scroll, or a coin that slips past
  // gets dragged away mid-pull and never arrives (Felix, 2026-07-12): its pull
  // is world speed plus a real closing speed, so caught means collected.
  const pullR = G.magnet ? 110 : 42;
  const pullV = G.magnet ? worldSpeed() + 230 : 170;
  for (const c of G.coinDots) {
    if (c.got) continue;
    const dx = G.px - c.x, dy = py - c.y, d = Math.hypot(dx, dy);

      // 16... capped x5); one hit resets the chain. Greed is the skill.
      G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo);
      const tier = comboTier();

      if (G.combo >= 8 && G.combo % 8 === 0 && tier > 1)
        floatText(c.x, c.y - 20, "COMBO x" + tier, "#ffc93c");
    }
  }
  R3().frame(py, dt, vs, frameMs);
  requestAnimationFrame(loop);
}

// For the current stage shape, find the tightest field of view (and aim
// point) that keeps (a) the full track width FAR_REQ ahead of the orb and
// (b) the orb's whole lane at the orb's depth inside the frame and below the
// HUD strip, with the camera at either extreme of its sideways follow.

function solveCamera(aspect, hudFrac) {

  for (const x of [0, 400]) for (const y of [0, 26]) pts.push([X(x), y, 0]);
  pts.push([X(200), 0, 40]);                                  // a little floor behind the orb

    cam.fov = fov;

      placeCam(cam, cx, lookZ);
      for (const p of pts) {
        _v.set(p[0], p[1], p[2]).project(cam);
        if (_v.z > 1 || Math.abs(_v.x) > m || _v.y < -m || _v.y > topLim) return false;
      }

    if (!fits(hi, lookZ)) continue;
    for (let k = 0; k < 22; k++) { const mid = (lo + hi) / 2; if (fits(mid, lookZ)) hi = mid; else lo = mid; }
    cam.fov = hi; placeCam(cam, 0, lookZ);

    if (!best || hi < best.fov) best = { fov: hi, lookZ };

  const yAt = z => +_v.set(0, 0, z).project(cam).y.toFixed(3);
  const pitch = +(Math.atan2(CAM_H, CAM_BACK + best.lookZ) * 180 / Math.PI).toFixed(1);
  return { ...best, pitch, nearW: wAt(0), farW: wAt(-FAR_REQ), orbY: yAt(0), farY: yAt(-FAR_REQ) };

function drawWorld(py, dt) {

      if (!inView(d.y)) return;

      const hover = 15 + Math.sin(tNow * 5 + i) * 2.5;
      g.position.set(X(d.x), 0, Z(d.y));
      m.scale.set(d.r, d.r, d.r); m.position.y = hover;
      m.rotation.z = Math.sin(tNow * 3 + i) * 0.35;           // banking wobble (visual only)
      eye.position.set(0, hover + d.r * 0.55, d.r * 0.1);
      h.position.y = hover; spill.scale.set(d.r * 4.2, 1, d.r * 4.2);
    });
  } else if (gid === "tunnel") {
    drawTunnel();
  } else if (gid === "laser") {
    drawLaser();
  } else if (gid === "crushers") {
    drawCrushers();
  } else if (gid === "slalom") {
    drawSlalom();
  } else if (gid === "pong") {
    drawPong();
  } else if (gid === "windmill") {
    drawWindmill();
  } else if (gid === "mines") {
    drawMines();
  } else if (gid === "pistons") {
    drawPistons();
  } else if (gid === "phantom") {

  } else if (gid === "turrets") {

  } else if (gid === "wind") {

  }
  barPool.end(); rockPool.end(); dronePool.end(); tunSpill.end();
  laserSegPool.end(); laserNodePool.end(); capPool.end(); flagPool.end();
  ballPool.end(); hubPool.end(); bladePool.end(); mineBodyPool.end();
  mineRingPool.end(); blastPool.end(); phantomPool.end(); turretPool.end();
  barrelPool.end(); bulletPool.end(); windPool.end();

  // sparks (render-rate life, as in 2D draw)
  let n = 0;
  for (let i = G.sparks.length - 1; i >= 0; i--) {
    const s = G.sparks[i];
    s.life -= 0.016; if (s.life <= 0) { G.sparks.splice(i, 1); continue; }
    s.x += s.vx * 0.016; s.y += s.vy * 0.016;
    if (n >= SPARK_MAX) continue;
    const up = 12 + (0.5 - s.life) * 40;
    spPos[n*3] = X(s.x); spPos[n*3+1] = up; spPos[n*3+2] = Z(s.y);
    const c = colOf(s.color), k = Math.min(1, s.life * 2);
    spCol[n*3] = c.r * k; spCol[n*3+1] = c.g * k; spCol[n*3+2] = c.b * k; n++;
  }
  spGeo.setDrawRange(0, n);
  spGeo.attributes.position.needsUpdate = spGeo.attributes.color.needsUpdate = true;
}

function drawTunnel() {
  tunMesh.visible = tunEdgeL.visible = tunEdgeR.visible = true;
  // rows anchored to course distance (every 16 px, the path's own sample
  // spacing) so walls don't shimmer; 2D samples the same path the same way
  const zFar = -(FOG_FAR + 30), zNear = CAM_BACK + 40;   // past the fog: nothing to draw (tall walls would mask the horizon)
  const kMin = Math.floor((G.traveled - PY - zNear) / 16), kMax = Math.ceil((G.traveled - PY - zFar) / 16);
  const rows = [];
  for (let k = Math.max(kMin, Math.floor((G.traveled - PY - zNear) / 16)); k <= kMax && rows.length < T_ROWS; k++) {
    const dist = k * 16, y = G.traveled - dist;
    let xl, xr;
    if (dist < 0) { xl = -40; xr = W + 40; }
    else {
      const seg = G.path[Math.min(G.path.length - 1, Math.round(dist / 16))] || { x: W / 2 };
      const hw = G.tunnelW(dist); xl = seg.x - hw; xr = seg.x + hw;
    }
    rows.push([Z(y), X(xl), X(xr)]);
  }
  let v = 0;
  const P = (x, y, z, c) => { tunPos[v*3] = x; tunPos[v*3+1] = y; tunPos[v*3+2] = z; tunCol[v*3] = c.r; tunCol[v*3+1] = c.g; tunCol[v*3+2] = c.b; v++; };
  const OUT = 700;
  for (let i = 0; i + 1 < rows.length; i++) {
    const [z0, l0, r0] = rows[i], [z1, l1, r1] = rows[i + 1];
    // left wall top (outer -> inner gradient) + inner face
    P(-OUT, WALL_H, z0, TC.topOut); P(l0 - RIM, WALL_H, z0, TC.topMid); P(l1 - RIM, WALL_H, z1, TC.topMid);
    P(-OUT, WALL_H, z0, TC.topOut); P(l1 - RIM, WALL_H, z1, TC.topMid); P(-OUT, WALL_H, z1, TC.topOut);
    P(l0 - RIM, WALL_H, z0, TC.topMid); P(l0, WALL_H, z0, TC.topIn); P(l1, WALL_H, z1, TC.topIn);
    P(l0 - RIM, WALL_H, z0, TC.topMid); P(l1, WALL_H, z1, TC.topIn); P(l1 - RIM, WALL_H, z1, TC.topMid);
    P(l0, WALL_H, z0, TC.faceTop); P(l0, 0, z0, TC.faceBot); P(l1, 0, z1, TC.faceBot);
    P(l0, WALL_H, z0, TC.faceTop); P(l1, 0, z1, TC.faceBot); P(l1, WALL_H, z1, TC.faceTop);
    // right wall
    P(r0 + RIM, WALL_H, z0, TC.topMid); P(OUT, WALL_H, z0, TC.topOut); P(OUT, WALL_H, z1, TC.topOut);
    P(r0 + RIM, WALL_H, z0, TC.topMid); P(OUT, WALL_H, z1, TC.topOut); P(r1 + RIM, WALL_H, z1, TC.topMid);
    P(r0, WALL_H, z0, TC.topIn); P(r0 + RIM, WALL_H, z0, TC.topMid); P(r1 + RIM, WALL_H, z1, TC.topMid);
    P(r0, WALL_H, z0, TC.topIn); P(r1 + RIM, WALL_H, z1, TC.topMid); P(r1, WALL_H, z1, TC.topIn);
    P(r0, WALL_H, z0, TC.faceTop); P(r1, 0, z1, TC.faceBot); P(r0, 0, z0, TC.faceBot);
    P(r0, WALL_H, z0, TC.faceTop); P(r1, WALL_H, z1, TC.faceTop); P(r1, 0, z1, TC.faceBot);
  }
  tunGeo.setDrawRange(0, v);
  tunGeo.attributes.position.needsUpdate = tunGeo.attributes.color.needsUpdate = true;
  const eL = tunEdgeL.geometry.attributes.position.array, eR = tunEdgeR.geometry.attributes.position.array;
  rows.forEach(([z, l, r], i) => { eL.set([l, WALL_H + 0.3, z], i * 3); eR.set([r, WALL_H + 0.3, z], i * 3); });
  tunEdgeL.geometry.setDrawRange(0, rows.length); tunEdgeR.geometry.setDrawRange(0, rows.length);
  tunEdgeL.geometry.attributes.position.needsUpdate = tunEdgeR.geometry.attributes.position.needsUpdate = true;
  // floor light spill along the channel walls, every 4th row
  for (let i = 0; i + 4 < rows.length; i += 4) {
    const [z0, l0, r0] = rows[i], [z1, l1, r1] = rows[i + 4], zm = (z0 + z1) / 2, len = Math.abs(z1 - z0) + 8;
    for (const xm of [(l0 + l1) / 2, (r0 + r1) / 2]) {
      const s = tunSpill.next(); s.position.set(xm, 0.4, zm); s.scale.set(46, 1, len);
    }
  }
}

const _p = new THREE.Vector3();

function drawHud(showRunHud) {
  hx.clearRect(0, 0, SW, SH);

    f.y -= 34 * 0.016;

    hx.globalAlpha = Math.min(1, f.life * 1.6); hx.fillStyle = f.color;
    hx.fillText(f.txt, sx, sy); hx.globalAlpha = 1;
  }
  // turret telegraph: same flash rate as 2D (Math.floor(G.t*12)%2), same

/* ================= PERF + LOOK-AHEAD MEASUREMENT ================= */
const perf = { intervals: [], cpu: [], frames: 0 };
const vis = new Map();         // hazard -> {t2, t3, tReach}
function measure(py) {
  const band = 1 - 2 * (HUD_PX / SH);
  const fogAt = (x, y, z) => { const d = viewDepth(x, y, z); return Math.max(0, Math.min(1, (d - scene.fog.near) / (scene.fog.far - scene.fog.near))); };
  const seen3 = (x0, x1, y0, y1, z0, z1) => {
    for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) {
      _p.set(x, y, z).project(camera);
      if (_p.z < 1 && _p.x > -1 && _p.x < 1 && _p.y > -1 && _p.y < band && fogAt(x, y, z) <= 0.5) return true;
    }
    return false;
  };
  const fog2 = (x, y) => G.mod !== "fog" || Math.hypot(x - G.px, y - py) < 167;   // 2D radial fog half-alpha
  const track = (key, s2, s3, reached) => {
    let e = vis.get(key); if (!e) { e = { t2: null, t3: null, tReach: null }; vis.set(key, e); }
    if (e.t2 === null && s2) e.t2 = G.t;
    if (e.t3 === null && s3) e.t3 = G.t;
    if (e.tReach === null && reached) e.tReach = G.t;
  };
  if (PICK === "gauntlet" || PICK === "wind") for (const o of G.obstacles) {
    if (o.y < -900) continue;
    const s2 = o.y + 7 > 0 && fog2(Math.max(0, Math.min(W, G.px)), o.y);
    const s3 = seen3(X(0), X(W), 0, BAR_H, Z(o.y) - BAR_D / 2, Z(o.y) + BAR_D / 2);
    track(o, s2, s3, o.y > py - 12);
  }
  if (PICK === "laser") for (const b of G.beams) {
    if (b.y < -900) continue;
    const s2 = b.y + b.thick > 0 && fog2(Math.max(0, Math.min(W, G.px)), b.y);
    const s3 = seen3(X(0), X(W), 0, 16, Z(b.y) - 8, Z(b.y) + 8);
    track(b, s2, s3, b.y > py - b.thick - 10);
  }
  if (PICK === "crushers") for (const c of G.things) {
    if (c.y < -900) continue;
    const s2 = c.y + 7 > 0 && fog2(c.cxm, c.y);
    const s3 = seen3(X(0), X(W), 0, BAR_H, Z(c.y) - BAR_D / 2, Z(c.y) + BAR_D / 2);
    track(c, s2, s3, c.y > py - 12);
  }
  if (PICK === "slalom") for (const g2 of G.things) {
    if (g2.y < -900) continue;
    const s2 = g2.y + 6 > 0 && fog2(g2.side === 0 ? 0 : W, g2.y);
    const s3 = seen3(X(0), X(W), 0, BAR_H, Z(g2.y) - BAR_D / 2, Z(g2.y) + BAR_D / 2);
    track(g2, s2, s3, g2.y > py - 12);
  }
  if (PICK === "pistons") for (const p of G.things) {
    if (p.y < -900) continue;
    const s2 = p.y + 11 > 0 && fog2(p.side === 0 ? 0 : W, p.y);
    const s3 = seen3(X(0), X(W), 0, BAR_H, Z(p.y) - BAR_D / 2, Z(p.y) + BAR_D / 2);
    track(p, s2, s3, p.y > py - 11);
  }
  if (PICK === "pong") for (const b of G.things) {
    if (b.y < -900) continue;
    track(b, b.y + b.r > 0 && fog2(b.x, b.y), seen3(X(b.x - b.r), X(b.x + b.r), 0, 2 * b.r, Z(b.y) - b.r, Z(b.y) + b.r), b.y > py - b.r - 10);
  }
  if (PICK === "windmill") for (const w of G.things) {
    if (w.y < -900) continue;
    const half = w.len / 2;
    const s2 = w.y + half > 0 && fog2(w.cxm, w.y);
    // full swing radius in Z too -- the blade sweeps in the ground plane, so a
    // tight z-band around the hub misses the tip's nearest reach mid-rotation
    const s3 = seen3(X(w.cxm - half), X(w.cxm + half), 0, 18, Z(w.y) - half, Z(w.y) + half);
    track(w, s2, s3, w.y > py - half - 24);
  }
  if (PICK === "mines") for (const m of G.things) {
    if (m.y < -900) continue;
    track(m, m.y + m.r > 0 && fog2(m.x, m.y), seen3(X(m.x - m.r), X(m.x + m.r), 0, 2 * m.r, Z(m.y) - m.r, Z(m.y) + m.r), m.y > py - 80);
  }
  if (PICK === "phantom") for (const o of G.obstacles) {
    if (o.y < -900) continue;
    // phantom's own fade gate is STRICTER than the generic camera fog (it stays
    // invisible until 330 world-px ahead of the player, well inside the normal
    // fog band) -- s2 must reflect that reveal, not just fog2, so the "no later
    // than 2D" check is measuring the real 2D telegraph.
    const s2 = o.y + 7 > 0 && fog2(Math.max(0, Math.min(W, G.px)), o.y) && (o.y - (py - 330)) > 1.9;
    const s3 = seen3(X(0), X(W), 0, BAR_H, Z(o.y) - BAR_D / 2, Z(o.y) + BAR_D / 2);
    track(o, s2, s3, o.y > py - 12);
  }
  // turrets: the aim telegraph is a HUD line keyed directly to the shared
  // sim's t.aiming flag (see drawHud), so its reveal instant is byte-identical
  // between 2D and 3D by construction -- no separate lead/lag to measure.
  if (PICK === "meteor") for (const r of G.rocks) {
    if (r.y < -900) continue;
    track(r, r.y + r.r > 0 && fog2(r.x, r.y), seen3(X(r.x - r.r), X(r.x + r.r), 0, 2 * r.r, Z(r.y) - r.r, Z(r.y) + r.r), r.y > py - r.r - 10);
  }
  if (PICK === "hunter") for (const d of G.things) {
    if (d.y < -900) continue;
    track(d, d.y + d.r > 0 && fog2(d.x, d.y), seen3(X(d.x - d.r), X(d.x + d.r), 10, 22, Z(d.y) - d.r, Z(d.y) + d.r), d.y > py - d.r - 10);
  }
  if (PICK === "tunnel") {
    // every 64 px of course is one "hazard": its two wall edges
    const k0 = Math.floor((G.traveled - py) / 64), k1 = Math.ceil((G.traveled + 900) / 64);
    for (let k = Math.max(0, k0); k <= k1; k++) {
      const dist = k * 64, y = G.traveled - dist;
      const seg = G.path[Math.min(G.path.length - 1, Math.round(dist / 16))]; if (!seg) continue;
      const hw = G.tunnelW(dist), xl = seg.x - hw, xr = seg.x + hw;
      const s2 = y > 0 && fog2(seg.x, y);
      const s3 = seen3(X(Math.max(0, xl)), X(Math.max(0, xl)), 0, WALL_H, Z(y), Z(y)) && seen3(X(Math.min(W, xr)), X(Math.min(W, xr)), 0, WALL_H, Z(y), Z(y));
      track("row" + k, s2, s3, y > py);
    }
  }
}
function measureReport() {
  const rows = [...vis.values()].filter(e => e.t2 !== null && e.t2 > 0.3 && e.tReach !== null);
  const lead = rows.map(e => (e.t2 - (e.t3 ?? Infinity)));
  const warn2 = rows.map(e => e.tReach - e.t2), warn3 = rows.map(e => e.tReach - (e.t3 ?? e.tReach));
  const mn = a => a.length ? Math.min(...a) : null, avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  return { n: rows.length, minLead: mn(lead), avgLead: avg(lead), neverSeen3: rows.filter(e => e.t3 === null).length,
           minWarn2: mn(warn2), minWarn3: mn(warn3), avgWarn2: avg(warn2), avgWarn3: avg(warn3), cam: CAMFIT, fog: [scene.fog.near, scene.fog.far] };
}

/* ================= HOOKS FOR THE SIM SCRIPT ================= */
function still() {                                          // static backdrop behind the overlays
  setFog(); camX = 0; drawWorld(PY, 0); drawHud(false); present();
}
let runFrames = 0;
window.R3D = {
  ready: true,
  onStart() { runFrames = 0; scroll = 0; vis.clear(); perf.intervals = []; perf.cpu = []; setFog(); },
  onEnd() { drawHud(false); present(); },
  frame(py, dt, vs, frameMs) {
    const t0 = performance.now();
    scroll += vs;
    drawWorld(py, dt);
    drawHud(true);
    present();
    if (PERF) renderer.getContext().finish();
    const cpu = performance.now() - t0;
    runFrames++;
    if (runFrames > 20) { perf.intervals.push(frameMs); perf.cpu.push(cpu); }
    if (MEASURE) measure(py);
  },
  still, measureReport,
  perfReport() {
    const q = (a, p) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return +s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(2); };
    return { mode: MODE, autoLite, frames: perf.intervals.length, intervalP50: q(perf.intervals, .5), intervalP95: q(perf.intervals, .95),
             cpuP50: q(perf.cpu, .5), cpuP95: q(perf.cpu, .95), dpr: DPR, size: [SW, SH], cam: CAMFIT };
  },
  setMode(m) { MODE = m; autoLite = false; applyMode(); if (!G.running) still(); },
  info() { return { renderer: renderer.getContext().getParameter(renderer.getContext().VERSION), cam: CAMFIT, fog: [scene.fog.near, scene.fog.far] }; },
};
new ResizeObserver(() => resize()).observe(stage);
addEventListener("resize", resize);
applyMode();
resize();
const go = document.getElementById("goBtn"); go.disabled = false; go.textContent = "START";
</script>
